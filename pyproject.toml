[project]
name = "setu"
version = "0.0.1"
description = "SETU — Verified Multilingual Voice AI for Welfare-Scheme Eligibility"
requires-python = ">=3.12,<3.13"
# Python pinned to 3.12: see docs/decisions/ADR-001-python-version.md
# Heavy ML deps are added in the phase that first needs them.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "httpx>=0.28.1",
    "sentencepiece>=0.2.2",
    "indictranstoolkit>=1.1.1",
    "transformers>=4.41,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai", "backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
